services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: triadbot-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_HOST: "${N8N_HOST:-localhost}"
      WEBHOOK_URL: "${N8N_WEBHOOK_PUBLIC_URL:-http://localhost:5678/}"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Asia/Jakarta}"
      TZ: "${TZ:-Asia/Jakarta}"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      N8N_DIAGNOSTICS_ENABLED: "${N8N_DIAGNOSTICS_ENABLED:-false}"
      N8N_PERSONALIZATION_ENABLED: "${N8N_PERSONALIZATION_ENABLED:-false}"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
